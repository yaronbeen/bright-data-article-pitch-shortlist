[project]
name = "article-pitch-shortlist"
version = "0.1.0"
description = "Deterministic publisher-fit checks and human-reviewed article pitch drafts"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yaron Been"}]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "iniconfig==2.3.0",
  "packaging==26.0",
  "pluggy==1.6.0",
  "Pygments==2.17.2",
]

[project.scripts]
article-pitch-shortlist = "article_pitch_shortlist.cli:main"

[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["article_pitch_shortlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
